[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "companies-simulator"
version = "0.1.0"
description = "Companies Simulator with Hexagonal Architecture"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=1.4",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pytest>=7.0",
    "Flask==3.0.0",
    "Flask-CORS==4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
