name: Deploy to GCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Deploy to VM
        env:
          VM_NAME: ${{ secrets.GCP_VM_NAME }}
          VM_ZONE: ${{ secrets.GCP_VM_ZONE }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          # Copy files to VM
          gcloud compute scp --recurse . ${VM_NAME}:~/companies_simulator --zone=${VM_ZONE} --project=${PROJECT_ID}
          
          # Execute deployment script on VM
          gcloud compute ssh ${VM_NAME} --zone=${VM_ZONE} --project=${PROJECT_ID} --command="cd ~/companies_simulator && ./deploy.sh"

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
