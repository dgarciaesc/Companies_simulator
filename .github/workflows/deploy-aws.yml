name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # Setup SSH key
          echo "$EC2_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem
          
          # Create .ssh directory and add EC2 to known hosts
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Copy built frontend to server
          echo "📦 Copying frontend build to server..."
          scp -i ec2_key.pem -r frontend/build ${EC2_USER}@${EC2_HOST}:~/companies_simulator/frontend/
          
          # Execute deployment on server
          ssh -i ec2_key.pem ${EC2_USER}@${EC2_HOST} << 'ENDSSH'
            set -e
            cd ~/companies_simulator
            
            # Stash any local changes and pull latest
            echo "📥 Pulling latest changes..."
            git stash
            git pull origin main
            
            # Update backend only (frontend already copied)
            echo "🚀 Updating backend..."
            python3 -m venv .venv
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -e .
            pip install -r requirements.txt
            
            # Database migration
            export DATABASE_URL="postgresql://companies_user:${DB_PASSWORD}@localhost:5432/companies_db"
            export PGPASSWORD="${DB_PASSWORD}"
            psql -U companies_user -d companies_db -h localhost -f sql/schema.sql 2>/dev/null || true
            
            # Fix permissions for Nginx
            chmod +x /home/ubuntu
            chmod -R 755 /home/ubuntu/companies_simulator/frontend/build
            
            # Restart services
            echo "🔄 Restarting services..."
            sudo systemctl restart companies-api
            sudo systemctl restart nginx
            
            echo "✅ Deployment complete!"
          ENDSSH
          
          # Cleanup
          rm ec2_key.pem

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment to EC2 successful!"
          else
            echo "❌ Deployment to EC2 failed!"
          fi
