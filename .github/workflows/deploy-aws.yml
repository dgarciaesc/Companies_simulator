name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Setup SSH key
          echo "$EC2_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem
          
          # Add EC2 to known hosts
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Create deployment package
          tar czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.venv' \
            --exclude='frontend/build' \
            --exclude='__pycache__' \
            .
          
          # Copy to EC2
          scp -i ec2_key.pem deploy.tar.gz ${EC2_USER}@${EC2_HOST}:/tmp/
          
          # Execute deployment
          ssh -i ec2_key.pem ${EC2_USER}@${EC2_HOST} << 'ENDSSH'
            set -e
            cd ~
            
            # Backup current deployment
            if [ -d "companies_simulator" ]; then
              cp -r companies_simulator companies_simulator_backup_$(date +%Y%m%d_%H%M%S)
            fi
            
            # Extract new version
            mkdir -p companies_simulator
            tar xzf /tmp/deploy.tar.gz -C companies_simulator
            rm /tmp/deploy.tar.gz
            
            # Run deployment script
            cd companies_simulator
            chmod +x deploy.sh
            ./deploy.sh
          ENDSSH
          
          # Cleanup
          rm ec2_key.pem

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment to EC2 successful!"
          else
            echo "❌ Deployment to EC2 failed!"
          fi
